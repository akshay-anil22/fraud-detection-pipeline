global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Pull-based scraping of the FastAPI serving layer.
  # Target is the Docker Compose SERVICE name "api" (internal DNS), not the
  # container_name label -- using the wrong name here shows the target DOWN.
  - job_name: "fraud-api"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8000"]

  # Scrape Prometheus itself so up{job="prometheus"} sanity-checks the stack.
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]